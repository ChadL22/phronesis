name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # redeploy after the daily bills refresh; its commit is pushed with the
  # built-in GITHUB_TOKEN, which does not trigger the push event above
  workflow_run:
    workflows: ["Refresh bills tracker"]
    types: [completed]

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Remove non-asset directories
        run: |
          rm -rf node_modules
          rm -rf .astro
          rm -rf dist
          rm -rf .git
          rm -rf .github
          rm -rf .wrangler

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config wrangler.json
